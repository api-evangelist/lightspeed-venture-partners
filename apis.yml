aid: lightspeed-venture-partners
name: Lightspeed Venture Partners
description: >-
  Lightspeed Venture Partners is a global, multi-stage venture capital firm
  founded in 2000 by Barry Eggers, Christopher Schaepe, Ravi Mhatre, and Peter
  Nieh, and headquartered in Menlo Park, California. Lightspeed invests from
  seed through Series F and beyond, backing bold builders across artificial
  intelligence, cybersecurity, cloud and enterprise infrastructure, developer
  tools, fintech, consumer, gaming, and healthcare/biotech. The firm operates
  as a single global team across roughly a dozen offices in the United States,
  Europe, Israel, India, and Southeast Asia, with U.S./Europe/Israel run by
  Lightspeed Management Company (LSVP) and India/Southeast Asia by Lightspeed
  India Partners (LSIP). Lightspeed reports managing on the order of $25B+ (up
  to $40B+ by some self-reported figures) across the Lightspeed platform.
  Notable investments and exits include Anthropic, Mistral AI, ElevenLabs, Wiz,
  Rubrik, Cato Networks, Stripe, Affirm, Snap, Nutanix, MuleSoft, AppDynamics,
  Nest, Grafana, ngrok, Faire, and Navan.
